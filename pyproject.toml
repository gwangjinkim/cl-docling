[project]
name = "cl-docling-reference"
version = "0.2.0"
description = "Independent vision fixtures and validation tooling; runtime is Common Lisp"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mlx==0.32.2",
  "torch==2.14.0",
  "transformers==5.16.1",
  "safetensors==0.8.0",
  "huggingface-hub==1.30.0",
  "numpy==2.5.3",
  "tokenizers==0.23.2",
  "pillow==12.3.0",
  "peft==0.20.0",
]
[project.optional-dependencies]
cpu = ["mlx[cpu]==0.32.2"]
cuda12 = ["mlx[cuda12]==0.32.2"]
cuda13 = ["mlx[cuda13]==0.32.2"]
[tool.uv]
package = false
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]
conflicts = [[{extra = "cpu"}, {extra = "cuda12"}, {extra = "cuda13"}]]
