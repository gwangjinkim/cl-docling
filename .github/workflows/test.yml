name: Public source and retained-evidence tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install explicit system dependencies
        run: sudo apt-get update && sudo apt-get install -y sbcl poppler-utils coreutils python3
      - name: Test clean Lisp runtime
        run: make test
      - name: Run offline examples
        run: |
          make example
          make example-markdown
          make example-table
          make example-merged-table
      - name: Verify shipped dataset and parser evidence
        run: |
          make test-dataset-audit
          make test-dataset-geometry
          make test-dpbench
          make test-parser-replay
          make test-corpus-preflight
      - name: Verify shipped quality and benchmark evidence
        run: |
          make test-table-score
          make test-adaptation
          make test-coverage
          make test-selection
          make test-benchmark
          make test-mlx-vlm
          make test-upload-benchmark
          make test-memory-benchmark
          make test-adapted-benchmark
          make test-adapter-portability
      - name: Verify install, PDF, and document-bundle evidence
        run: |
          make test-install
          make test-public-install
          make test-public-pdf
          make test-footers
          make example-public-markdown
          make test-bundles
          make test-bundle-reference
          make example-public-bundle
          make example-supervision
          make test-pdf
      - name: Verify compact final experiment evidence
        run: make test-book-final-evaluation
      - name: Test resumable PDF application and command grammar
        run: |
          make test-application
          bin/cl-docling --help
          python3 scripts/test_application_evidence.py
