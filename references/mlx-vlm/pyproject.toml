[project]
name = "cl-docling-mlx-vlm-reference"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mlx-vlm==0.6.14",
  "mlx==0.32.2",
  "transformers==5.16.1",
  "torch==2.14.0",
  "numpy==2.5.3",
  "pillow==12.3.0",
  "safetensors==0.8.0",
  "huggingface-hub==1.30.0",
  "tokenizers==0.23.2",
]

[tool.uv]
package = false
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
